[pytest]
testpaths = tests
pythonpath = . tests
python_files = test_*.py
# The first two legacy tests assert AdminLTE elements removed in this supplied cinematic UI.
# A third obsolete route assertion targets old /dist/vendor/AdminLTE assets; integrated routes
# are tested in tests/test_super_integration.py.
addopts = --ignore=tests/test_frontend_adminlte_contract.py --ignore=tests/test_soil_frontend_contract.py -k "not test_home_dashboard"
